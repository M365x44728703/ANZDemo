name: Pack NTTDataSolution

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Repository Structure
        shell: pwsh
        run: |
          Write-Host "Current Directory:"
          Get-Location

          Write-Host "Repository Files:"
          Get-ChildItem -Path . -Recurse

      - name: Verify Solution Files
        shell: pwsh
        run: |
          if (Test-Path ".\contents\Other\Customizations.xml") {
            Write-Host "Customizations.xml found"
          }
          else {
            Write-Error "Customizations.xml NOT FOUND"
            exit 1
          }

      - name: Pack Solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: contents
          solution-file: main/NTTDataSolution.zip
          solution-type: Both

      - name: Upload Solution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTTDataSolution
          path: |
            main/NTTDataSolution.zip
            main/NTTDataSolution_managed.zip
